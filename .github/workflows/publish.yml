name: Publish to NPM

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish"
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write

    env:
      VERSION: ${{ inputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"

      - name: Display version info
        run: echo "📦 Publishing version $VERSION"

      - name: Install dependencies
        run: bun install

      - name: Verify package.json matches input version
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          if [ "$CURRENT" != "$VERSION" ]; then
            echo "::error::package.json version ($CURRENT) does not match requested version ($VERSION)."
            echo "::error::Commit the version bump to the branch before dispatching this workflow."
            exit 1
          fi
          echo "package.json version matches: $CURRENT"

      - name: Build project
        run: bun run build

      - name: Verify build
        run: |
          test -f dist/cli.js || { echo "::error::dist/cli.js missing"; exit 1; }
          test -f bin/claude-multi.js || { echo "::error::bin/claude-multi.js missing"; exit 1; }
          node dist/cli.js --version
          sh bin/claude-multi.js --version

      - name: Verify package contents
        run: npm pack --dry-run

      - name: Publish to NPM
        run: npm publish --access public

      - name: Get package name
        id: package
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          echo "name=$PACKAGE_NAME" >> "$GITHUB_OUTPUT"

      - name: Create Git tag
        run: |
          if git ls-remote --tags origin "refs/tags/v$VERSION" | grep -q .; then
            echo "Tag v$VERSION already exists, skipping"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "v$VERSION" -m "Release v$VERSION"
            git push origin "v$VERSION"
          fi

      - name: Extract release notes
        run: bun run scripts/extract-changelog.ts "$VERSION" --out RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: v${{ inputs.version }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false

      - name: Publish Summary
        run: |
          {
            echo "## 📦 NPM Publish Summary"
            echo ""
            echo "- **Package**: ${{ steps.package.outputs.name }}"
            echo "- **Version**: $VERSION"
            echo ""
            echo "✅ Successfully published version $VERSION to NPM!"
            echo ""
            echo "[View on NPM](https://www.npmjs.com/package/${{ steps.package.outputs.name }})"
          } >> "$GITHUB_STEP_SUMMARY"
