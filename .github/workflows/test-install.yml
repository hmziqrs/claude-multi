name: Test Install

on:
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths:
      - 'bin/**'
      - 'src/**'
      - 'package.json'
      - '.github/workflows/test-install.yml'

jobs:
  # ─────────────────────────────────────────────
  # Linux: bun only, no node at all
  # Uses plain Debian + manual bun install so node is genuinely absent.
  # oven/bun:latest ships /usr/local/bun-node-fallback-bin/node internally.
  # ─────────────────────────────────────────────
  linux-bun-only:
    name: Linux / bun only (no node)
    runs-on: ubuntu-latest
    container:
      image: debian:12-slim

    steps:
      - name: Install bun (no node)
        run: |
          apt-get update -qq && apt-get install -y curl unzip -qq
          curl -fsSL https://bun.sh/install | bash
          echo "/root/.bun/bin" >> $GITHUB_PATH

      - uses: actions/checkout@v4

      - name: Confirm bun present, node absent
        run: |
          bun --version
          ! command -v node || (echo "ERROR: node found in PATH" && exit 1)
          echo "Good: no node"

      - name: Install deps + build
        run: bun install && bun run build

      - name: Pack tarball
        run: bun x npm pack

      - name: bun install -g from tarball
        run: bun install -g ./claude-multi-*.tgz

      - name: Verify shim resolves to our script
        run: |
          SHIM=$(which claude-multi)
          echo "Shim: $SHIM"
          ls -la "$SHIM"
          REAL=$(realpath "$SHIM")
          echo "Resolves to: $REAL"
          head -2 "$REAL"
          grep -q '#!/bin/sh' "$REAL" || (echo "ERROR: not our sh shim" && exit 1)

      - name: Run --version (no node, must use bun)
        run: claude-multi --version

      - name: Run --help
        run: claude-multi --help

  # ─────────────────────────────────────────────
  # Linux: npm global install, bun wins over node
  # ─────────────────────────────────────────────
  linux-npm-global:
    name: Linux / npm global (bun wins over node)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install deps + build + pack
        run: bun install && bun run build && npm pack

      - name: npm install -g
        run: npm install -g ./claude-multi-*.tgz

      - name: Confirm shim is our sh script (not npm node wrapper)
        run: |
          SHIM=$(which claude-multi)
          REAL=$(realpath "$SHIM")
          echo "Shim content (first 2 lines):"
          head -2 "$REAL"
          grep -q '#!/bin/sh' "$REAL" || (echo "ERROR: npm replaced our shim" && exit 1)

      - name: Run --version (bun chosen over node)
        run: claude-multi --version

  # ─────────────────────────────────────────────
  # Windows: bun global install — cmd.exe, no sh needed
  # ─────────────────────────────────────────────
  windows-bun-global:
    name: Windows / bun global (cmd.exe)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install deps + build + pack
        run: bun install && bun run build && bun x npm pack
        shell: pwsh

      - name: bun install -g from tarball
        run: |
          for /f %%f in ('dir /b claude-multi-*.tgz') do bun install -g %%f
        shell: cmd

      - name: Show bun shim location
        run: where claude-multi
        shell: cmd

      - name: Run --version via cmd.exe (pure cmd, no sh)
        run: claude-multi --version
        shell: cmd

      - name: Run --help via cmd.exe
        run: claude-multi --help
        shell: cmd

  # ─────────────────────────────────────────────
  # Windows: npm global install
  # npm generates a .cmd that calls sh (Git Bash available on runner)
  # ─────────────────────────────────────────────
  windows-npm-global:
    name: Windows / npm global (cmd.exe + Git Bash sh)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install deps + build + pack
        run: bun install && bun run build && npm pack
        shell: pwsh

      - name: npm install -g
        run: npm install -g (Get-Item claude-multi-*.tgz).FullName
        shell: pwsh

      - name: Show what npm generated as the global .cmd shim
        run: |
          where claude-multi
          echo --- shim content ---
          type "%APPDATA%\npm\claude-multi.cmd"
        shell: cmd

      - name: Run --version via cmd.exe
        run: claude-multi --version
        shell: cmd

  # ─────────────────────────────────────────────
  # Windows: local install — npm uses our .cmd in node_modules/.bin/
  # Tests our .cmd directly in bare cmd.exe with bun available
  # ─────────────────────────────────────────────
  windows-local-cmd:
    name: Windows / local .cmd (cmd.exe, bun only)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install deps + build + pack
        run: bun install && bun run build && npm pack
        shell: pwsh

      - name: Local npm install
        run: npm install (Get-Item claude-multi-*.tgz).FullName
        shell: pwsh

      - name: Show what npm put in .bin/
        run: dir node_modules\.bin\claude-multi*
        shell: cmd

      - name: Confirm .bin\ has our .cmd file
        run: type node_modules\.bin\claude-multi.cmd
        shell: cmd

      - name: Run our .cmd via cmd.exe (bun + node both available)
        run: node_modules\.bin\claude-multi.cmd --version
        shell: cmd

      - name: Run with node stripped from PATH (bun only scenario)
        run: |
          set "PATH=%USERPROFILE%\.bun\bin;%SystemRoot%\System32;%SystemRoot%\System32\WindowsPowerShell\v1.0"
          node_modules\.bin\claude-multi.cmd --version
        shell: cmd

  # ─────────────────────────────────────────────
  # macOS: bun global install
  # ─────────────────────────────────────────────
  macos-bun-global:
    name: macOS / bun global
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install deps + build + pack
        run: bun install && bun run build && npm pack

      - name: bun install -g
        run: bun install -g ./claude-multi-*.tgz

      - name: Run --version
        run: claude-multi --version

      - name: Run --help
        run: claude-multi --help
