name: Test Install

on:
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths:
      - 'bin/**'
      - 'src/**'
      - 'package.json'
      - '.github/workflows/test-install.yml'

jobs:
  # ─────────────────────────────────────────────
  # Build once on Linux, upload tarball as artifact
  # ─────────────────────────────────────────────
  build:
    name: Build tarball
    runs-on: ubuntu-latest

    outputs:
      tgz: ${{ steps.pack.outputs.tgz }}

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install deps + build + pack
        id: pack
        run: |
          bun install
          bun run build
          TGZ=$(npm pack)
          echo "tgz=$TGZ" >> $GITHUB_OUTPUT
          echo "Packed: $TGZ"

      - uses: actions/upload-artifact@v4
        with:
          name: tarball
          path: ${{ steps.pack.outputs.tgz }}
          retention-days: 1

  # ─────────────────────────────────────────────
  # Linux: bun only, no node — simulated by removing node from PATH
  # (Avoids Docker container step isolation issues)
  # ─────────────────────────────────────────────
  linux-bun-only:
    name: Linux / bun only (no node)
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - uses: actions/download-artifact@v4
        with:
          name: tarball

      - name: Install + run with node stripped from PATH
        run: |
          TGZ="${{ needs.build.outputs.tgz }}"

          # Strip every node-containing dir from PATH
          CLEAN_PATH=$(echo "$PATH" | tr ':' '\n' | grep -v -E '/node|nvm|nodenv' | tr '\n' ':' | sed 's/:$//')
          echo "Clean PATH: $CLEAN_PATH"

          # Confirm node is gone, bun remains
          env PATH="$CLEAN_PATH" sh -c '! command -v node || (echo "ERROR: node still in PATH" && exit 1)'
          env PATH="$CLEAN_PATH" bun --version

          # Install globally
          env PATH="$CLEAN_PATH" bun install -g "./$TGZ"

          # Verify shim + run
          SHIM=$(env PATH="$CLEAN_PATH" which claude-multi)
          REAL=$(realpath "$SHIM")
          echo "Shim: $SHIM -> $REAL"
          head -2 "$REAL"
          grep -q '#!/bin/sh' "$REAL" || (echo "ERROR: not our sh shim" && exit 1)

          env PATH="$CLEAN_PATH" claude-multi --version
          env PATH="$CLEAN_PATH" claude-multi --help

  # ─────────────────────────────────────────────
  # Linux: npm global install, bun wins over node
  # ─────────────────────────────────────────────
  linux-npm-global:
    name: Linux / npm global (bun wins over node)
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - uses: actions/download-artifact@v4
        with:
          name: tarball

      - name: npm install -g
        run: npm install -g "./${{ needs.build.outputs.tgz }}"

      - name: Confirm shim is our sh script
        run: |
          REAL=$(realpath "$(which claude-multi)")
          echo "Resolves to: $REAL"
          head -2 "$REAL"
          grep -q '#!/bin/sh' "$REAL" || (echo "ERROR: npm replaced our shim" && exit 1)

      - name: Run --version (bun chosen over node)
        run: claude-multi --version

  # ─────────────────────────────────────────────
  # Windows: bun global install — pure cmd.exe, no sh needed
  # bun creates its own native shim, bypasses our sh script entirely
  # ─────────────────────────────────────────────
  windows-bun-global:
    name: Windows / bun global (cmd.exe)
    needs: build
    runs-on: windows-latest

    steps:
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - uses: actions/download-artifact@v4
        with:
          name: tarball

      - name: bun install -g (use .\ prefix so bun treats it as local file)
        run: bun install -g ".\${{ needs.build.outputs.tgz }}"
        shell: cmd

      - name: Show shim location + type
        run: |
          where claude-multi
          for /f "tokens=*" %%p in ('where claude-multi') do echo Shim: %%p
        shell: cmd

      - name: Run --version via cmd.exe
        run: claude-multi --version
        shell: cmd

      - name: Run --help via cmd.exe
        run: claude-multi --help
        shell: cmd

  # ─────────────────────────────────────────────
  # Windows: npm global install
  # npm generates a .cmd that calls sh — Git Bash provides sh on windows-latest
  # ─────────────────────────────────────────────
  windows-npm-global:
    name: Windows / npm global (cmd.exe + Git Bash sh)
    needs: build
    runs-on: windows-latest

    steps:
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - uses: actions/download-artifact@v4
        with:
          name: tarball

      - name: npm install -g
        run: npm install -g ".\${{ needs.build.outputs.tgz }}"
        shell: cmd

      - name: Show npm global prefix + generated shim
        run: |
          set "PREFIX="
          for /f "tokens=*" %%p in ('npm prefix -g') do set "PREFIX=%%p"
          echo NPM global prefix: %PREFIX%
          where claude-multi
          echo --- generated shim content ---
          for /f "tokens=*" %%f in ('where claude-multi.cmd') do type "%%f"
        shell: cmd

      - name: Run --version via cmd.exe
        run: claude-multi --version
        shell: cmd

  # ─────────────────────────────────────────────
  # Windows: local npm install
  # Confirms npm generates its own .cmd (not using our bin/claude-multi.cmd)
  # and that it works via Git Bash sh on the runner
  # ─────────────────────────────────────────────
  windows-local-npm:
    name: Windows / local npm install (cmd.exe)
    needs: build
    runs-on: windows-latest

    steps:
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - uses: actions/download-artifact@v4
        with:
          name: tarball

      - name: Local npm install
        run: npm install ".\${{ needs.build.outputs.tgz }}"
        shell: cmd

      - name: Show what npm created in .bin\
        run: dir node_modules\.bin\claude-multi*
        shell: cmd

      - name: Show the generated .cmd content
        run: type node_modules\.bin\claude-multi.cmd
        shell: cmd

      - name: Run via node_modules\.bin\ in cmd.exe
        run: node_modules\.bin\claude-multi --version
        shell: cmd

  # ─────────────────────────────────────────────
  # macOS: bun global install
  # ─────────────────────────────────────────────
  macos-bun-global:
    name: macOS / bun global
    needs: build
    runs-on: macos-latest

    steps:
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - uses: actions/download-artifact@v4
        with:
          name: tarball

      - name: bun install -g (use ./ prefix for local file)
        run: bun install -g "./${{ needs.build.outputs.tgz }}"

      - name: Run --version
        run: claude-multi --version

      - name: Run --help
        run: claude-multi --help
