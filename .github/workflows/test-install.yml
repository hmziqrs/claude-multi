name: Test Install

on:
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths:
      - 'bin/**'
      - 'src/**'
      - 'package.json'
      - '.github/workflows/test-install.yml'

jobs:
  # ─────────────────────────────────────────────
  # Build once on Linux, upload tarball as artifact
  # ─────────────────────────────────────────────
  build:
    name: Build tarball
    runs-on: ubuntu-latest

    outputs:
      tgz: ${{ steps.pack.outputs.tgz }}

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install deps + build + pack
        id: pack
        run: |
          bun install
          bun run build
          TGZ=$(npm pack)
          echo "tgz=$TGZ" >> $GITHUB_OUTPUT
          echo "Packed: $TGZ"

      - uses: actions/upload-artifact@v4
        with:
          name: tarball
          path: ${{ steps.pack.outputs.tgz }}
          retention-days: 1

  # ─────────────────────────────────────────────
  # Linux / bun — no node in PATH
  # ─────────────────────────────────────────────
  linux-bun-only:
    name: Linux / bun (no node)
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - uses: actions/download-artifact@v4
        with:
          name: tarball
          path: artifact

      - name: Install + verify
        run: |
          CLEAN=$(echo "$PATH" | tr ':' '\n' | grep -vE '(node|nvm|nodenv)' | tr '\n' ':')
          echo "PATH: $CLEAN"

          env PATH="$CLEAN" bun --version
          if env PATH="$CLEAN" command -v node 2>/dev/null; then
            echo "ERROR: node still in PATH" && exit 1
          fi
          echo "Good: no node"

          ABS_TGZ="$(pwd)/artifact/${{ needs.build.outputs.tgz }}"
          env PATH="$CLEAN" bun install -g "$ABS_TGZ"

          REAL=$(realpath "$(env PATH="$CLEAN" which claude-multi)")
          head -2 "$REAL"
          grep -q '#!/usr/bin/env sh' "$REAL" || (echo "ERROR: wrong shebang" && exit 1)

          env PATH="$CLEAN" claude-multi --version
          env PATH="$CLEAN" claude-multi --help

  # ─────────────────────────────────────────────
  # Linux / node — no bun in PATH
  # ─────────────────────────────────────────────
  linux-node-only:
    name: Linux / node (no bun)
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - uses: actions/download-artifact@v4
        with:
          name: tarball
          path: artifact

      - name: Install via npm + run (bun absent)
        run: |
          if command -v bun 2>/dev/null; then
            echo "ERROR: bun found unexpectedly" && exit 1
          fi
          echo "Good: no bun"

          npm install -g "$(pwd)/artifact/${{ needs.build.outputs.tgz }}"
          claude-multi --version
          claude-multi --help

  # ─────────────────────────────────────────────
  # Linux / deno — run dist/cli.js directly with deno
  # ─────────────────────────────────────────────
  linux-deno:
    name: Linux / deno
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - uses: actions/download-artifact@v4
        with:
          name: tarball
          path: artifact

      - name: Extract + run dist/cli.js via deno
        run: |
          mkdir pkg
          tar -xzf "artifact/${{ needs.build.outputs.tgz }}" -C pkg --strip-components=1
          deno run -A pkg/dist/cli.js --version
          deno run -A pkg/dist/cli.js --help

  # ─────────────────────────────────────────────
  # Linux / npm global — bun wins over node
  # ─────────────────────────────────────────────
  linux-npm-bun-wins:
    name: Linux / npm global (bun wins over node)
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - uses: actions/download-artifact@v4
        with:
          name: tarball
          path: artifact

      - name: npm install -g
        run: npm install -g "$(pwd)/artifact/${{ needs.build.outputs.tgz }}"

      - name: Confirm shim + run (bun chosen over node)
        run: |
          REAL=$(realpath "$(which claude-multi)")
          head -2 "$REAL"
          grep -q '#!/usr/bin/env sh' "$REAL" || (echo "ERROR: wrong shebang" && exit 1)
          claude-multi --version

  # ─────────────────────────────────────────────
  # Windows / bun — pure cmd.exe
  # bun's .exe shim resolves #!/usr/bin/env sh via PATH lookup for sh.
  # Git for Windows ships sh.exe in usr\bin (not on PATH by default).
  # ─────────────────────────────────────────────
  windows-bun-global:
    name: Windows / bun (cmd.exe)
    needs: build
    runs-on: windows-latest

    steps:
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - uses: actions/download-artifact@v4
        with:
          name: tarball
          path: artifact

      - name: bun install -g
        run: |
          $tgz = (Resolve-Path "artifact\${{ needs.build.outputs.tgz }}").Path
          Write-Host "Installing: $tgz"
          bun install -g $tgz
        shell: pwsh

      - name: Add Git sh.exe to PATH (bun shim needs sh for #!/usr/bin/env sh)
        run: echo C:\Program Files\Git\usr\bin >> $env:GITHUB_PATH
        shell: pwsh

      - name: Show shim bun created
        run: where claude-multi
        shell: cmd

      - name: Run --version via cmd.exe
        run: claude-multi --version
        shell: cmd

      - name: Run --help via cmd.exe
        run: claude-multi --help
        shell: cmd

  # ─────────────────────────────────────────────
  # Windows / node — npm global install
  # npm generates a .cmd that calls node directly (no sh needed)
  # ─────────────────────────────────────────────
  windows-node-npm:
    name: Windows / node via npm
    needs: build
    runs-on: windows-latest

    steps:
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - uses: actions/download-artifact@v4
        with:
          name: tarball
          path: artifact

      - name: npm install -g
        run: |
          $tgz = (Resolve-Path "artifact\${{ needs.build.outputs.tgz }}").Path
          npm install -g $tgz
        shell: pwsh

      - name: Run --version (Git Bash)
        run: claude-multi --version
        shell: bash

  # ─────────────────────────────────────────────
  # Windows / deno — run dist/cli.js directly with deno
  # ─────────────────────────────────────────────
  windows-deno:
    name: Windows / deno
    needs: build
    runs-on: windows-latest

    steps:
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - uses: actions/download-artifact@v4
        with:
          name: tarball
          path: artifact

      - name: Extract + run dist/cli.js via deno
        run: |
          mkdir pkg
          tar -xzf "artifact/${{ needs.build.outputs.tgz }}" -C pkg --strip-components=1
          deno run -A pkg/dist/cli.js --version
          deno run -A pkg/dist/cli.js --help
        shell: bash

  # ─────────────────────────────────────────────
  # Windows / local npm install
  # ─────────────────────────────────────────────
  windows-local-npm:
    name: Windows / local npm install
    needs: build
    runs-on: windows-latest

    steps:
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - uses: actions/download-artifact@v4
        with:
          name: tarball
          path: artifact

      - name: Local npm install
        run: |
          $tgz = (Resolve-Path "artifact\${{ needs.build.outputs.tgz }}").Path
          npm install $tgz
        shell: pwsh

      - name: Show npm-generated .bin\ shims
        run: dir node_modules\.bin\claude-multi*
        shell: cmd

      - name: Run via node_modules/.bin/ (Git Bash)
        run: node_modules/.bin/claude-multi --version
        shell: bash

  # ─────────────────────────────────────────────
  # macOS / bun global
  # ─────────────────────────────────────────────
  macos-bun-global:
    name: macOS / bun global
    needs: build
    runs-on: macos-latest

    steps:
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - uses: actions/download-artifact@v4
        with:
          name: tarball
          path: artifact

      - name: bun install -g + run
        run: |
          bun install -g "$(pwd)/artifact/${{ needs.build.outputs.tgz }}"
          claude-multi --version
          claude-multi --help

  # ─────────────────────────────────────────────
  # macOS / node — npm global, no bun
  # ─────────────────────────────────────────────
  macos-node-npm:
    name: macOS / node via npm (no bun)
    needs: build
    runs-on: macos-latest

    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - uses: actions/download-artifact@v4
        with:
          name: tarball
          path: artifact

      - name: npm install -g + run (bun absent)
        run: |
          if command -v bun 2>/dev/null; then
            echo "ERROR: bun found unexpectedly" && exit 1
          fi
          echo "Good: no bun"

          npm install -g "$(pwd)/artifact/${{ needs.build.outputs.tgz }}"
          claude-multi --version
          claude-multi --help

  # ─────────────────────────────────────────────
  # macOS / deno — run dist/cli.js directly with deno
  # ─────────────────────────────────────────────
  macos-deno:
    name: macOS / deno
    needs: build
    runs-on: macos-latest

    steps:
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - uses: actions/download-artifact@v4
        with:
          name: tarball
          path: artifact

      - name: Extract + run dist/cli.js via deno
        run: |
          mkdir pkg
          tar -xzf "artifact/${{ needs.build.outputs.tgz }}" -C pkg --strip-components=1
          deno run -A pkg/dist/cli.js --version
          deno run -A pkg/dist/cli.js --help
