name: Test Install

on:
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths:
      - 'bin/**'
      - 'src/**'
      - 'package.json'
      - '.github/workflows/test-install.yml'

jobs:
  # ─────────────────────────────────────────────
  # Build once on Linux, upload tarball as artifact
  # ─────────────────────────────────────────────
  build:
    name: Build tarball
    runs-on: ubuntu-latest

    outputs:
      tgz: ${{ steps.pack.outputs.tgz }}

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install deps + build
        run: bun install && bun run build

      - name: Pack
        id: pack
        run: |
          TGZ=$(npm pack)
          echo "tgz=$TGZ" >> $GITHUB_OUTPUT
          echo "Packed: $TGZ"

      - uses: actions/upload-artifact@v4
        with:
          name: tarball
          path: ${{ steps.pack.outputs.tgz }}
          retention-days: 1

  # ─────────────────────────────────────────────
  # Linux: bun only, no node at all
  # ─────────────────────────────────────────────
  linux-bun-only:
    name: Linux / bun only (no node)
    needs: build
    runs-on: ubuntu-latest
    container:
      image: debian:12-slim

    steps:
      - name: Install bun (no node)
        run: |
          apt-get update -qq && apt-get install -y curl unzip -qq
          curl -fsSL https://bun.sh/install | bash
          ln -s /root/.bun/bin/bun /usr/local/bin/bun

      - uses: actions/download-artifact@v4
        with:
          name: tarball

      - name: Confirm bun present, node absent
        run: |
          bun --version
          if command -v node 2>/dev/null; then echo "ERROR: node found" && exit 1; fi
          echo "Good: no node in PATH"

      - name: bun install -g
        run: bun install -g ${{ needs.build.outputs.tgz }}

      - name: Verify shim is our sh script
        run: |
          SHIM=$(which claude-multi)
          REAL=$(realpath "$SHIM")
          echo "Shim: $SHIM -> $REAL"
          head -2 "$REAL"
          grep -q '#!/bin/sh' "$REAL" || (echo "ERROR: not our sh shim" && exit 1)

      - name: Run --version (bun only, no node)
        run: claude-multi --version

      - name: Run --help
        run: claude-multi --help

  # ─────────────────────────────────────────────
  # Linux: npm global install, bun wins over node
  # ─────────────────────────────────────────────
  linux-npm-global:
    name: Linux / npm global (bun wins over node)
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - uses: actions/download-artifact@v4
        with:
          name: tarball

      - name: npm install -g
        run: npm install -g ${{ needs.build.outputs.tgz }}

      - name: Confirm shim is our sh script
        run: |
          REAL=$(realpath "$(which claude-multi)")
          echo "Resolves to: $REAL"
          head -2 "$REAL"
          grep -q '#!/bin/sh' "$REAL" || (echo "ERROR: npm replaced our shim" && exit 1)

      - name: Run --version (bun chosen over node)
        run: claude-multi --version

  # ─────────────────────────────────────────────
  # Windows: bun global install — pure cmd.exe, no sh
  # ─────────────────────────────────────────────
  windows-bun-global:
    name: Windows / bun global (cmd.exe)
    needs: build
    runs-on: windows-latest

    steps:
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - uses: actions/download-artifact@v4
        with:
          name: tarball

      - name: bun install -g
        run: bun install -g ${{ needs.build.outputs.tgz }}
        shell: cmd

      - name: Show shim location
        run: where claude-multi
        shell: cmd

      - name: Run --version via cmd.exe (no sh)
        run: claude-multi --version
        shell: cmd

      - name: Run --help via cmd.exe
        run: claude-multi --help
        shell: cmd

  # ─────────────────────────────────────────────
  # Windows: npm global install
  # npm generates a .cmd calling sh — Git Bash is on windows-latest
  # ─────────────────────────────────────────────
  windows-npm-global:
    name: Windows / npm global (cmd.exe + Git Bash sh)
    needs: build
    runs-on: windows-latest

    steps:
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - uses: actions/download-artifact@v4
        with:
          name: tarball

      - name: npm install -g
        run: npm install -g ${{ needs.build.outputs.tgz }}
        shell: cmd

      - name: Show what npm generated as the global .cmd shim
        run: |
          where claude-multi
          echo --- shim content ---
          type "%APPDATA%\npm\claude-multi.cmd"
        shell: cmd

      - name: Run --version via cmd.exe
        run: claude-multi --version
        shell: cmd

  # ─────────────────────────────────────────────
  # Windows: local install — npm puts our .cmd in node_modules/.bin/
  # ─────────────────────────────────────────────
  windows-local-cmd:
    name: Windows / local .cmd (cmd.exe, bun only)
    needs: build
    runs-on: windows-latest

    steps:
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - uses: actions/download-artifact@v4
        with:
          name: tarball

      - name: Local npm install
        run: npm install ${{ needs.build.outputs.tgz }}
        shell: cmd

      - name: Show what npm put in .bin/
        run: dir node_modules\.bin\claude-multi*
        shell: cmd

      - name: Confirm .bin\ has our .cmd
        run: type node_modules\.bin\claude-multi.cmd
        shell: cmd

      - name: Run our .cmd via cmd.exe (bun + node both available)
        run: node_modules\.bin\claude-multi.cmd --version
        shell: cmd

      - name: Run with node stripped from PATH (bun only)
        run: |
          set "PATH=%USERPROFILE%\.bun\bin;%SystemRoot%\System32;%SystemRoot%\System32\WindowsPowerShell\v1.0"
          node_modules\.bin\claude-multi.cmd --version
        shell: cmd

  # ─────────────────────────────────────────────
  # macOS: bun global install
  # ─────────────────────────────────────────────
  macos-bun-global:
    name: macOS / bun global
    needs: build
    runs-on: macos-latest

    steps:
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - uses: actions/download-artifact@v4
        with:
          name: tarball

      - name: bun install -g
        run: bun install -g ${{ needs.build.outputs.tgz }}

      - name: Run --version
        run: claude-multi --version

      - name: Run --help
        run: claude-multi --help
