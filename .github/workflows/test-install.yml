name: Test Install

on:
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths:
      - 'bin/**'
      - 'src/**'
      - 'package.json'
      - '.github/workflows/test-install.yml'

jobs:
  # ─────────────────────────────────────────────
  # Build once on Linux, upload tarball as artifact
  # ─────────────────────────────────────────────
  build:
    name: Build tarball
    runs-on: ubuntu-latest

    outputs:
      tgz: ${{ steps.pack.outputs.tgz }}

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install deps + build + pack
        id: pack
        run: |
          bun install
          bun run build
          TGZ=$(npm pack)
          echo "tgz=$TGZ" >> $GITHUB_OUTPUT
          echo "Packed: $TGZ"

      - uses: actions/upload-artifact@v4
        with:
          name: tarball
          path: ${{ steps.pack.outputs.tgz }}
          retention-days: 1

  # ─────────────────────────────────────────────
  # Linux: bun only, no node
  # ─────────────────────────────────────────────
  linux-bun-only:
    name: Linux / bun only (no node)
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      # Download into artifact/ subdir so we have a clean relative path
      - uses: actions/download-artifact@v4
        with:
          name: tarball
          path: artifact

      - name: Install + verify (node stripped from PATH)
        run: |
          TGZ="artifact/${{ needs.build.outputs.tgz }}"

          # Strip node from PATH for this step
          CLEAN=$(echo "$PATH" | tr ':' '\n' | grep -vE '(node|nvm|nodenv)' | tr '\n' ':')
          echo "Using PATH: $CLEAN"

          # Confirm bun exists, node does not
          env PATH="$CLEAN" bun --version
          if env PATH="$CLEAN" command -v node 2>/dev/null; then
            echo "ERROR: node still in PATH after stripping" && exit 1
          fi
          echo "Good: no node"

          # Install from local tarball (absolute path avoids bun CWD confusion)
          ABS_TGZ="$(pwd)/$TGZ"
          env PATH="$CLEAN" bun install -g "$ABS_TGZ"

          # Verify shim
          SHIM=$(env PATH="$CLEAN" which claude-multi)
          REAL=$(realpath "$SHIM")
          echo "Shim: $SHIM -> $REAL"
          head -2 "$REAL"
          grep -q '#!/usr/bin/env bun' "$REAL" || (echo "ERROR: shebang not #!/usr/bin/env bun" && exit 1)

          # Run it
          env PATH="$CLEAN" claude-multi --version
          env PATH="$CLEAN" claude-multi --help

  # ─────────────────────────────────────────────
  # Linux: npm global install, bun wins over node
  # ─────────────────────────────────────────────
  linux-npm-global:
    name: Linux / npm global (bun wins over node)
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - uses: actions/download-artifact@v4
        with:
          name: tarball
          path: artifact

      - name: npm install -g
        run: npm install -g "$(pwd)/artifact/${{ needs.build.outputs.tgz }}"

      - name: Confirm shim is our bun script
        run: |
          REAL=$(realpath "$(which claude-multi)")
          echo "Resolves to: $REAL"
          head -2 "$REAL"
          grep -q '#!/usr/bin/env bun' "$REAL" || (echo "ERROR: shebang not #!/usr/bin/env bun" && exit 1)

      - name: Run --version (bun chosen over node)
        run: claude-multi --version

  # ─────────────────────────────────────────────
  # Windows: bun global install
  # bun creates a native .exe shim that reads #!/usr/bin/env bun and runs with bun
  # ─────────────────────────────────────────────
  windows-bun-global:
    name: Windows / bun global (cmd.exe)
    needs: build
    runs-on: windows-latest

    steps:
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - uses: actions/download-artifact@v4
        with:
          name: tarball
          path: artifact

      - name: bun install -g (absolute path)
        run: |
          $tgz = (Resolve-Path "artifact\${{ needs.build.outputs.tgz }}").Path
          Write-Host "Installing: $tgz"
          bun install -g $tgz
        shell: pwsh

      - name: Show shim bun created
        run: where claude-multi
        shell: cmd

      - name: Run --version via cmd.exe
        run: claude-multi --version
        shell: cmd

      - name: Run --help via cmd.exe
        run: claude-multi --help
        shell: cmd

  # ─────────────────────────────────────────────
  # Windows: npm global install
  # npm generates a .cmd that passes Windows paths to sh (Git Bash).
  # Run the final check via bash shell where paths work correctly.
  # ─────────────────────────────────────────────
  windows-npm-global:
    name: Windows / npm global (Git Bash sh)
    needs: build
    runs-on: windows-latest

    steps:
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - uses: actions/download-artifact@v4
        with:
          name: tarball
          path: artifact

      - name: npm install -g
        run: |
          $tgz = (Resolve-Path "artifact\${{ needs.build.outputs.tgz }}").Path
          npm install -g $tgz
        shell: pwsh

      - name: Show what npm generated as the global shim
        run: |
          $prefix = npm prefix -g
          Write-Host "NPM prefix: $prefix"
          Get-Command claude-multi | Select-Object -ExpandProperty Source
          Get-Content "$prefix\claude-multi.cmd"
        shell: pwsh

      # npm's .cmd calls sh with a Windows path — must use bash (Git Bash) here
      - name: Run --version via Git Bash sh
        run: claude-multi --version
        shell: bash

  # ─────────────────────────────────────────────
  # Windows: local npm install
  # Confirms npm generates its own wrapper (not using our bin/claude-multi.cmd)
  # ─────────────────────────────────────────────
  windows-local-npm:
    name: Windows / local npm install
    needs: build
    runs-on: windows-latest

    steps:
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - uses: actions/download-artifact@v4
        with:
          name: tarball
          path: artifact

      - name: Local npm install
        run: |
          $tgz = (Resolve-Path "artifact\${{ needs.build.outputs.tgz }}").Path
          npm install $tgz
        shell: pwsh

      - name: Show npm-generated .bin\ shims
        run: dir node_modules\.bin\claude-multi*
        shell: cmd

      - name: Show generated .cmd content (npm generates this, not us)
        run: type node_modules\.bin\claude-multi.cmd
        shell: cmd

      # npm-generated .cmd calls sh — must use bash (Git Bash) on Windows
      - name: Run via node_modules/.bin/ (Git Bash)
        run: node_modules/.bin/claude-multi --version
        shell: bash

  # ─────────────────────────────────────────────
  # macOS: bun global install
  # ─────────────────────────────────────────────
  macos-bun-global:
    name: macOS / bun global
    needs: build
    runs-on: macos-latest

    steps:
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - uses: actions/download-artifact@v4
        with:
          name: tarball
          path: artifact

      - name: bun install -g (absolute path)
        run: bun install -g "$(pwd)/artifact/${{ needs.build.outputs.tgz }}"

      - name: Run --version
        run: claude-multi --version

      - name: Run --help
        run: claude-multi --help
