<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>claude-multi og image</title>
<style>
  /* Self-hosted so the render never depends on system fonts.
     (public/fonts/*.woff2 in this repo are broken placeholders, so the OG
     renderer keeps its own known-good copies next to this template.) */
  @font-face {
    font-family: 'Inter';
    src: url('fonts/Inter-latin.woff2') format('woff2');
    font-weight: 100 900;
    font-style: normal;
  }
  @font-face {
    font-family: 'JetBrains Mono';
    src: url('fonts/JetBrainsMono-latin.woff2') format('woff2');
    font-weight: 100 800;
    font-style: normal;
  }

  /* Tokens mirrored from src/web/styles/redesign.css (coral theme). */
  :root {
    --surface-page: #0b0c0e;
    --bg: #0c0c0f;
    --surface-1: #101216;
    --surface-code: #0d0f13;
    --elevated: #14161b;
    --text-primary: #f2f3f5;
    --text-secondary: #a3a8b3;
    --text-muted: #7e8694;
    --accent: #d97757;
    --accent-hover: #e08a6d;
    --accent-soft: rgba(217, 119, 87, 0.12);
    --accent-border: rgba(217, 119, 87, 0.45);
    --border: #23262d;
    --font-sans: 'Inter', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 1200px;
    height: 630px;
    background: var(--bg);
  }

  .canvas {
    position: relative;
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background:
      radial-gradient(900px 520px at 20% 58%, rgba(217, 119, 87, 0.16), transparent 62%),
      radial-gradient(760px 440px at 88% 12%, rgba(217, 119, 87, 0.07), transparent 65%),
      var(--bg);
    font-family: var(--font-sans);
    -webkit-font-smoothing: antialiased;
  }

  /* Faint perspective floor grid under the window stack. */
  .grid {
    position: absolute;
    left: -60px;
    top: 0;
    width: 660px;
    height: 630px;
    background-image:
      linear-gradient(rgba(217, 119, 87, 0.09) 1px, transparent 1px),
      linear-gradient(90deg, rgba(217, 119, 87, 0.09) 1px, transparent 1px);
    background-size: 44px 44px;
    -webkit-mask-image: radial-gradient(420px 340px at 46% 55%, #000 0%, transparent 78%);
    mask-image: radial-gradient(420px 340px at 46% 55%, #000 0%, transparent 78%);
  }

  .edge {
    position: absolute;
    inset: 0;
    border: 1px solid rgba(217, 119, 87, 0.22);
  }

  /* ---------------- Left: stacked, tilted terminal windows ---------------- */
  .stack {
    position: absolute;
    left: 52px;
    top: 62px;
    width: 470px;
    height: 508px;
    perspective: 1400px;
  }

  .win {
    position: absolute;
    left: 0;
    width: 400px;
    height: 168px;
    border-radius: 16px;
    background: linear-gradient(150deg, rgba(217, 119, 87, 0.10), rgba(12, 12, 15, 0.92) 58%);
    border: 2px solid var(--accent);
    box-shadow:
      0 0 0 1px rgba(217, 119, 87, 0.18),
      0 0 34px rgba(217, 119, 87, 0.30),
      0 26px 46px rgba(0, 0, 0, 0.55);
    transform-origin: 50% 50%;
  }

  .win--back  { top: 268px; left: 6px;  transform: rotateX(46deg) rotateZ(-24deg) scale(0.99); opacity: 0.55; }
  .win--mid   { top: 168px; left: 32px; transform: rotateX(44deg) rotateZ(-24deg); opacity: 0.78; }
  .win--front { top: 58px;  left: 58px; transform: rotateX(42deg) rotateZ(-24deg); opacity: 1; }

  .win__bar {
    height: 34px;
    border-bottom: 1px solid rgba(217, 119, 87, 0.35);
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 16px;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); opacity: 0.85; }
  .dot:nth-child(2) { opacity: 0.6; }
  .dot:nth-child(3) { opacity: 0.38; }

  .win__body {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 30px 34px 0;
    font-family: var(--font-mono);
    font-size: 23px;
    font-weight: 600;
    color: var(--text-primary);
    letter-spacing: 0.5px;
  }
  .win__body .p { color: var(--accent); }

  .win--mid .win__body,
  .win--back .win__body {
    font-size: 26px;
    color: var(--accent);
  }

  /* ---------------- Right column ---------------- */
  .right {
    position: absolute;
    left: 560px;
    top: 56px;
    width: 592px;
  }

  .brand { display: flex; align-items: center; gap: 20px; }
  .brand svg { display: block; }
  .wordmark {
    font-size: 76px;
    font-weight: 700;
    letter-spacing: -2.6px;
    color: var(--text-primary);
    line-height: 1;
  }
  .wordmark .accent { color: var(--accent); }

  .tagline {
    margin-top: 20px;
    font-size: 30px;
    font-weight: 500;
    letter-spacing: -0.5px;
    color: var(--text-secondary);
    line-height: 1.28;
  }
  .tagline .accent { color: var(--accent-hover); font-weight: 600; }

  /* Alias terminal panel */
  .panel {
    margin-top: 26px;
    border: 1px solid var(--border);
    border-radius: 14px;
    background: linear-gradient(180deg, rgba(20, 22, 27, 0.95), rgba(13, 15, 19, 0.95));
    box-shadow: 0 0 0 1px rgba(217, 119, 87, 0.10), 0 18px 40px rgba(0, 0, 0, 0.45);
    overflow: hidden;
  }
  .panel__bar {
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 18px;
    border-bottom: 1px solid var(--border);
    background: rgba(217, 119, 87, 0.06);
  }
  .panel__bar .prompt {
    font-family: var(--font-mono);
    font-size: 19px;
    font-weight: 600;
    color: var(--accent);
  }
  .panel__dots { display: flex; gap: 8px; }
  .panel__dots i { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); display: block; }
  .panel__dots i:nth-child(2) { opacity: 0.7; }
  .panel__dots i:nth-child(3) { background: var(--text-muted); opacity: 0.55; }

  .row {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 0 20px;
    height: 47px;
    border-bottom: 1px solid rgba(35, 38, 45, 0.75);
    font-family: var(--font-mono);
    font-size: 23px;
    font-weight: 500;
    color: var(--text-primary);
    letter-spacing: 0.2px;
  }
  .row:last-child { border-bottom: none; }
  .row .chev { color: var(--accent); font-weight: 700; }

  /* Feature strip */
  .features {
    position: absolute;
    left: 560px;
    top: 502px;
    width: 592px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    color: var(--text-secondary);
    font-size: 18px;
    font-weight: 500;
    letter-spacing: -0.1px;
  }
  .feature { display: flex; align-items: center; gap: 9px; white-space: nowrap; }
  .sep { color: var(--accent); font-size: 15px; opacity: 0.8; }

  .url {
    position: absolute;
    right: 48px;
    top: 566px;
    display: flex;
    align-items: center;
    gap: 11px;
    font-family: var(--font-mono);
    font-size: 21px;
    font-weight: 500;
    color: var(--accent-hover);
    letter-spacing: 0.2px;
  }
</style>
</head>
